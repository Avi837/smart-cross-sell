<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Cross-Sell - Product Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #111827;
        }

        .header {
            background: #111827;
            color: white;
            padding: 22px 40px;
        }

        .header h1 {
            font-size: 25px;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            margin-top: 22px;
            padding: 13px 18px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .green-button {
            background: #16a34a;
        }

        .blue-button {
            background: #2563eb;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 20px;
        }

        .product-card {
            border: 1px solid #e5e7eb;
            padding: 20px;
            border-radius: 12px;
        }

        .product-card h3 {
            margin-bottom: 8px;
        }

        .product-card p {
            color: #6b7280;
            margin-bottom: 5px;
        }

        .qr-area {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #e5e7eb;
        }

        #qrcode {
            margin: 20px auto;
            width: 256px;
        }

        .url {
            background: #f3f4f6;
            padding: 12px;
            border-radius: 8px;
            word-break: break-all;
            font-size: 13px;
        }

        .empty {
            color: #6b7280;
            padding: 15px 0;
        }

        @media (max-width: 700px) {
            .products {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>📦 Smart Cross-Sell — Product Manager</h1>
    </div>


    <div class="container">

        <!-- ADD PRODUCT -->

        <div class="box">

            <h2>➕ Add New Product</h2>

            <p class="subtitle">
                Add a product and create its QR code.
            </p>


            <label>Product Name</label>

            <input
                type="text"
                id="productName"
                placeholder="Example: Navy Formal Shirt"
            >


            <label>Product ID</label>

            <input
                type="text"
                id="productId"
                placeholder="Example: SHIRT004"
            >


            <label>Price (₹)</label>

            <input
                type="number"
                id="price"
                placeholder="Example: 1999"
            >


            <label>Category</label>

            <select id="category">

                <option value="Fashion">
                    Fashion
                </option>

                <option value="Footwear">
                    Footwear
                </option>

                <option value="Jewellery">
                    Jewellery
                </option>

                <option value="Cosmetics">
                    Cosmetics
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <button
                class="blue-button"
                onclick="saveProduct()"
            >
                💾 Save Product
            </button>

        </div>


        <!-- SAVED PRODUCTS -->

        <div class="box">

            <h2>📦 Saved Products</h2>

            <div id="productList" class="products">

                <div class="empty">
                    No products added yet.
                </div>

            </div>

        </div>


        <!-- QR -->

        <div
            class="box"
            id="qrBox"
            style="display:none;"
        >

            <div class="qr-area">

                <h2>✅ Product QR Ready</h2>

                <div id="qrcode"></div>

                <p id="qrProductName"></p>

                <br>

                <div
                    class="url"
                    id="qrUrl"
                ></div>


                <button
                    class="green-button"
                    onclick="downloadQR()"
                >
                    ⬇️ Download QR
                </button>

            </div>

        </div>

    </div>


    <!-- QR LIBRARY -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <script>

        // Load saved products
        let savedProducts =
            JSON.parse(
                localStorage.getItem("smartProducts")
            ) || [];


        // =========================
        // SAVE PRODUCT
        // =========================

        function saveProduct() {

            const name =
                document.getElementById("productName").value.trim();

            const id =
                document.getElementById("productId").value.trim();

            const price =
                document.getElementById("price").value.trim();

            const category =
                document.getElementById("category").value;


            if (!name || !id || !price) {

                alert(
                    "Please fill Product Name, Product ID and Price."
                );

                return;
            }


            // Check duplicate ID

            const existing =
                savedProducts.find(
                    product => product.id === id
                );


            if (existing) {

                alert(
                    "This Product ID already exists."
                );

                return;
            }


            const product = {

                name: name,

                id: id,

                price: Number(price),

                category: category

            };


            savedProducts.push(product);


            localStorage.setItem(
                "smartProducts",
                JSON.stringify(savedProducts)
            );


            alert(
                "Product saved successfully! ✅"
            );


            clearForm();

            displayProducts();

            generateQR(product);

        }


        // =========================
        // DISPLAY PRODUCTS
        // =========================

        function displayProducts() {

            const list =
                document.getElementById("productList");


            if (savedProducts.length === 0) {

                list.innerHTML =
                    '<div class="empty">No products added yet.</div>';

                return;
            }


            list.innerHTML = "";


            savedProducts.forEach(
                function(product) {

                    const card =
                        document.createElement("div");

                    card.className =
                        "product-card";


                    card.innerHTML = `

                        <h3>
                            ${product.name}
                        </h3>

                        <p>
                            Product ID: ${product.id}
                        </p>

                        <p>
                            Price: ₹${product.price.toLocaleString("en-IN")}
                        </p>

                        <p>
                            Category: ${product.category}
                        </p>

                        <button
                            class="blue-button"
                            onclick="generateQRById('${product.id}')"
                        >
                            📱 Generate QR
                        </button>

                    `;


                    list.appendChild(card);

                }
            );

        }


        // =========================
        // GENERATE QR
        // =========================

        function generateQR(product) {

            const productURL =
                "https://avi837.github.io/smart-cross-sell/?product="
                + encodeURIComponent(product.id);


            document.getElementById("qrcode").innerHTML = "";


            new QRCode(
                document.getElementById("qrcode"),
                {
                    text: productURL,
                    width: 256,
                    height: 256,
                    correctLevel: QRCode.CorrectLevel.H
                }
            );


            document.getElementById("qrProductName").textContent =
                product.name +
                " — " +
                product.id;


            document.getElementById("qrUrl").textContent =
                productURL;


            document.getElementById("qrBox").style.display =
                "block";


            window.scrollTo({
                top: document.body.scrollHeight,
                behavior: "smooth"
            });

        }


        // =========================
        // GENERATE QR BY ID
        // =========================

        function generateQRById(id) {

            const product =
                savedProducts.find(
                    item => item.id === id
                );


            if (product) {

                generateQR(product);

            }

        }


        // =========================
        // DOWNLOAD QR
        // =========================

        function downloadQR() {

            const canvas =
                document.querySelector("#qrcode canvas");


            if (!canvas) {

                alert(
                    "Please generate a QR first."
                );

                return;
            }


            const id =
                document.getElementById("qrProductName")
                .textContent
                .split("—")[1]
                .trim();


            const link =
                document.createElement("a");


            link.download =
                "product-" + id + "-QR.png";


            link.href =
                canvas.toDataURL("image/png");


            link.click();

        }


        // =========================
        // CLEAR FORM
        // =========================

        function clearForm() {

            document.getElementById("productName").value = "";

            document.getElementById("productId").value = "";

            document.getElementById("price").value = "";

        }


        // =========================
        // START
        // =========================

        displayProducts();

    </script>

</body>
</html>
